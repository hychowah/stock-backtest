[package]
name = "app"
version.workspace = true
edition.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
engine = { path = "../engine" }
market-data = { path = "../market-data" }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
tables = { path = "../tables" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
ts-rs = "12"

[dev-dependencies]
ureq = { version = "3", default-features = false }
