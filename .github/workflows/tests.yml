name: Tests

on:
  push:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the Rust tests, which write the TypeScript types afresh
        # ts-rs never deletes the file of a removed type: removing the folder
        # first makes such a file show as deleted in the next step.
        run: |
          rm -r web/src/api
          cargo test --locked
      - name: Check that the committed TypeScript types are the ones the tests generate
        run: |
          changed=$(git status --porcelain -- web/src/api)
          if [ -n "$changed" ]; then echo "$changed"; git diff -- web/src/api; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run the browser checks of the website against the built bt
        # `cargo test` has built target/debug/bt, which the checks start.
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npx playwright test
      - name: Keep the traces of a failed browser check
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-results
          path: web/test-results

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
