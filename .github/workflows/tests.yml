name: Tests

on:
  push:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run the fast test tier
        run: python3 tests/run.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the Rust tests
        run: cargo test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Export the oracle tables of the fictional fixture
        run: >-
          python3 proof/export.py --raw fixtures/fictional/raw --as-of 2023-06-30T07:30:00+00:00
          --tests fixtures/fictional/tests --out "$RUNNER_TEMP/oracle-export"
      - name: Compare the oracle tables with the expected tables
        run: cargo run -q -p tables -- fixtures/fictional/expected "$RUNNER_TEMP/oracle-export"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm test
