<dialog id="variable-dialog" aria-labelledby="variable-dialog-title">
  <div class="variable-dialog-head"><h2 id="variable-dialog-title">Variable</h2><div class="variable-head-actions"><button type="button" id="variable-favourite" hidden>☆ Favourite</button><button type="button" id="variable-delete" hidden>Delete</button><button type="button" id="variable-close">Close</button></div></div>
  <div class="variable-form">
    <label for="variable-name">Name</label><input id="variable-name" maxlength="120" autocomplete="off" placeholder="Optional">
    <label for="variable-formula">Formula</label>
    <div class="filter-combo"><textarea id="variable-formula" rows="2" spellcheck="false" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="variable-suggestions" placeholder="For example: Total debt / Enterprise value"></textarea><div id="variable-suggestions" class="filter-options" role="listbox" aria-label="Suggestions" hidden></div></div>
    <div id="variable-check" class="variable-check" data-state="empty"><span id="variable-check-text" role="status" aria-live="polite">Type a formula</span> <label id="variable-display-label" hidden>· Show as <select id="variable-display"></select></label><span id="variable-fixes"></span></div>
    <div id="variable-picture" class="variable-picture" aria-label="How the formula was read"></div>
  </div>
  <div class="variable-actions"><button type="button" id="variable-save">Save to My variables</button><button type="button" id="variable-save-new" hidden>Save as new</button><button type="button" id="variable-apply" class="primary">Use</button></div>
  <p id="variable-message" role="status" aria-live="polite"></p>
  <details id="variable-inputs"><summary>All inputs</summary><div id="variable-input-list"></div></details>
</dialog>
<section id="scalar-evidence-view" class="panel" hidden aria-label="Immutable variable results"><div class="toolbar"><h2 id="scalar-evidence-heading">Variable results</h2><div><button type="button" id="scalar-download-rows">Download selected CSV</button><button type="button" id="scalar-download-returns">Download returns CSV</button><button type="button" id="scalar-download-evidence">Download complete evidence</button></div></div><p id="scalar-result-producer" class="hint" aria-live="polite"></p><p id="scalar-evidence-summary"></p><p id="scalar-evidence-message" role="status"></p><div id="scalar-screen-results" hidden><div class="latest-table" tabindex="0" role="region" aria-label="Variable screen rows"><table class="stock-table"><thead><tr><th>Rank</th><th>Symbol</th><th>Company</th><th>Ranking value</th><th>Unit</th><th>Direction</th><th>Details</th></tr></thead><tbody id="scalar-screen-rows"></tbody></table></div><div class="variable-toolbar"><button type="button" id="scalar-screen-back">Previous stocks</button><span id="scalar-screen-page"></span><button type="button" id="scalar-screen-next">Next stocks</button></div></div><details id="scalar-explanation"><summary>Original formula and calculation evidence</summary><div id="scalar-explanation-content"></div></details></section>
