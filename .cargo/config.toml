# The TypeScript types generated from the serde types: their folder, imports
# with the `.ts` extension that the website's module resolution needs, and
# 64-bit integers as numbers (the values sent stay below 2^53). `cargo test`
# writes them; it never deletes the file of a removed type, so remove the
# folder before the tests to regenerate it whole, as CI does.
[env]
TS_RS_EXPORT_DIR = { value = "web/src/api", relative = true }
TS_RS_IMPORT_EXTENSION = "ts"
TS_RS_LARGE_INT = "number"
